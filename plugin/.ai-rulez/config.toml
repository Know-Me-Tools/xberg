version = "5.0"
default_layers = ["plugins"]
name = "xberg"
description = "Local document extraction: text, tables, metadata, images from 107 formats with optional OCR."
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
agents_md = false
# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
gitignore = true

# ~keep Goldziher/ai-rulez#485: generated plugin skill copies repeat the plugin/.ai-rulez source skills.
[[lint.ignore_rules]]
rules = ["AR701", "AR703"]
paths = [
  "plugin/.cursor-plugin/skills/*/SKILL.md",
  "plugin/.hermes/package/src/xberg_hermes_plugin/skills/*/SKILL.md",
  "plugin/.hermes/plugins/xberg/skills/*/SKILL.md",
  "plugin/.opencode/skills/*/SKILL.md",
  "plugin/.pi/skills/*/SKILL.md",
  "plugin/skills/*/SKILL.md",
]
reason = "Generated harness copies of the plugin source skills; ai-rulez counts each copy as a duplicate."
